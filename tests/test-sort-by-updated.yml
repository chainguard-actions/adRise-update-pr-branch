name: Test with sort by updated
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with sort=updated and direction=asc
        id: action
        uses: .
        continue-on-error: true
        with:
          base: main
          token: ${{ github.token }}
          required_approval_count: '0'
          require_auto_merge_enabled: 'false'
          require_passed_checks: 'false'
          sort: 'updated'
          direction: 'asc'

      - name: Assert action completed (sort=updated direction=asc)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action step was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran with outcome=$OUTCOME (sort=updated direction=asc)"
