name: Test direction and included_labels inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          base: main
          required_approval_count: '0'
          require_passed_checks: 'false'
          require_auto_merge_enabled: 'false'
          direction: asc
          included_labels: 'automerge,ready-to-merge'
          token: fake-token-for-testing
      - name: Assert action ran with direction and included_labels inputs
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          # The action is expected to fail with an invalid token (API error),
          # but it should not produce an unexpected crash.
          if [ "${{ steps.action.outcome }}" = "success" ] || [ "${{ steps.action.outcome }}" = "failure" ]; then
            echo "PASS: action completed with outcome ${{ steps.action.outcome }}"
          else
            echo "FAIL: unexpected outcome ${{ steps.action.outcome }}"
            exit 1
          fi
