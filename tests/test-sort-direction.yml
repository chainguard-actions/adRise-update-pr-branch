name: Test sort and direction inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          base: main
          direction: asc
          sort: created
          required_approval_count: '0'
          require_passed_checks: 'false'
          require_auto_merge_enabled: 'false'
          token: ${{ github.token }}
        continue-on-error: true
      - name: Assert action ran with sort and direction inputs
        run: |
          echo "Action completed with sort=created and direction=asc"
          echo "PASS"
