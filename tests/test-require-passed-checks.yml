name: Test require-passed-checks option
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action with require_passed_checks and allow_ongoing_checks enabled
        id: action
        uses: .
        with:
          base: main
          required_approval_count: '0'
          require_passed_checks: 'true'
          allow_ongoing_checks: 'true'
          require_auto_merge_enabled: 'false'
          token: ${{ github.token }}
        continue-on-error: true
      - name: Assert action ran
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped, expected it to run"
            exit 1
          fi
          echo "PASS: action ran with outcome=$OUTCOME"
