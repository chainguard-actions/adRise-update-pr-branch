name: Test auto-merge required (default behavior)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      checks: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        name: Run update-pr-branch with auto-merge required
        uses: .
        continue-on-error: true
        with:
          base: main
          token: ${{ github.token }}
          required_approval_count: '0'
          require_auto_merge_enabled: 'true'
          require_passed_checks: 'false'
      - name: Assert action ran and completed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # With require_auto_merge_enabled=true, the action filters to only auto-merge PRs.
          # In a test repo with no auto-merge PRs, it should succeed with "No applicable PR".
          # Either success or failure is acceptable — we verify the action ran.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action completed with outcome: $OUTCOME"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
