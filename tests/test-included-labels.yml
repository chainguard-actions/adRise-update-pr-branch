name: Test included_labels input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run update-pr-branch with included_labels filter
        id: action
        uses: .
        with:
          token: ${{ github.token }}
          base: main
          required_approval_count: '0'
          require_auto_merge_enabled: 'false'
          require_passed_checks: 'false'
          included_labels: 'automerge,ready-to-merge'
        continue-on-error: true
      - name: Assert action completed with included_labels input
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # The action either succeeds (no matching PRs) or fails (API error).
          # Both success and failure are acceptable — we only reject cancelled/skipped.
          if [ "$OUTCOME" = "cancelled" ] || [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was unexpectedly $OUTCOME"
            exit 1
          fi
          echo "PASS: action completed with outcome=$OUTCOME"
