name: Test allow ongoing checks option
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      checks: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        name: Run update-pr-branch with allow_ongoing_checks
        uses: .
        continue-on-error: true
        with:
          base: main
          token: ${{ github.token }}
          required_approval_count: '999'
          require_auto_merge_enabled: 'false'
          require_passed_checks: 'true'
          allow_ongoing_checks: 'true'
      - name: Assert action ran and completed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # With allow_ongoing_checks=true and require_passed_checks=true,
          # the action skips PRs with failed checks but allows those with ongoing checks.
          # With required_approval_count=999, no PR should be updated.
          # Either success or failure is acceptable — we verify the action ran.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action completed with outcome: $OUTCOME"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
