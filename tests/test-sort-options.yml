name: Test sort and direction options
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action with sort and direction options (expect failure with invalid token)
        id: action
        uses: .
        with:
          base: main
          required_approval_count: '1'
          require_passed_checks: 'false'
          require_auto_merge_enabled: 'false'
          sort: 'created'
          direction: 'asc'
          token: 'invalid-token-for-testing'
        continue-on-error: true
      - name: Assert action ran and failed with API error
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid token, got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when given an invalid token with sort/direction options"
