name: Test basic usage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: push
      GITHUB_REF: refs/heads/master
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          token: ${{ github.token }}
          base: master
          required_approval_count: '1'
          require_passed_checks: 'true'
          require_auto_merge_enabled: 'false'
      - name: Assert action ran without unexpected errors
        run: |
          echo "Action completed (may have found no PRs to update, which is expected in test environment)"
          echo "PASS"
