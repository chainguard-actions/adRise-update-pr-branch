name: Test basic usage - no qualifying PRs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run update-pr-branch action with default settings
        id: action
        uses: .
        continue-on-error: true
        with:
          base: main
          token: ${{ github.token }}
          required_approval_count: '999'
          require_passed_checks: 'true'
          require_auto_merge_enabled: 'true'
        # required_approval_count: 999 ensures no PR will qualify,
        # so the action should always exit successfully with "No applicable PR to update."
        # continue-on-error: true handles cases where the action fails due to API issues.

      - name: Assert action completed (success or expected failure)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran and completed with outcome: $OUTCOME"
          else
            echo "FAIL: action did not complete, outcome was: $OUTCOME"
            exit 1
          fi
