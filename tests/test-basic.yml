name: Test basic usage - no qualifying PRs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with default settings
        id: action
        uses: .
        with:
          base: main
          token: ${{ github.token }}
          required_approval_count: '2'
          require_auto_merge_enabled: 'true'
          require_passed_checks: 'true'
        continue-on-error: true

      - name: Assert action completed (success or graceful no-op)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran and produced an outcome"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
          echo "PASS"
